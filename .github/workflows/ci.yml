name: CI

on:
  push:
  pull_request:

jobs:
  audit:
    name: Fairness audit (92+ checks against shipped classes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache the standalone Kotlin compiler
        uses: actions/cache@v4
        with:
          path: ~/.dawnpatrol-kt
          key: dawnpatrol-kt-1.9.24
      - name: Fetch the toolchain
        run: tools/kotlinc-setup.sh
      - name: Audit
        run: tools/audit.sh
      - name: Render frames
        run: |
          python3 -m pip install --quiet pillow
          tools/frames.sh
      - name: Keep the frames, so a visual regression is reviewable
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: out/kt/*.png

  apk:
    name: Build the APK (the only check the Android layer ever gets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # GameView.kt, Sound.kt and MainActivity.kt import android.* so the
      # off-device toolchain skips them on purpose. Before this job they
      # were only ever compiled when a human pressed Build in Android
      # Studio, which meant every change to them shipped unverified.
      - name: assembleDebug
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-patrol-debug-apk
          path: app/build/outputs/apk/debug/*.apk
